<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book Reader - Online Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <!-- Add PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
</head>
<body>
  <div data-include="partials/header.html"></div>

  <main class="container">
    <div id="bookDetails" class="book-details">
      <!-- Book Header Section -->
      <div class="book-header card">
        <div class="header-top">
          <button id="backBtn" class="btn ghost small back-btn">
            <span class="btn-icon">←</span>
            Back to Library
          </button>
          <a id="downloadBtn" class="btn primary download-btn">
            <span class="btn-icon">📥</span>
            Download PDF
          </a>
        </div>
        
        <div class="book-info">
          <h1 id="bookTitle" class="book-title">Loading...</h1>
          <p id="bookAuthor" class="book-author"></p>
          <p id="bookDesc" class="book-desc"></p>
        </div>
      </div>

      <!-- PDF Viewer Section -->
      <div class="pdf-viewer-section">
        <!-- PDF Controls - Top Only -->
        <div class="pdf-controls card">
          <div class="controls-group">
            <button id="prevPage" class="btn ghost small control-btn">
              <span class="btn-icon">◀</span>
              Previous
            </button>
            
            <div class="page-info">
              <span class="page-text">Page</span>
              <span id="currentPage" class="current-page">1</span>
              <span class="page-separator">of</span>
              <span id="totalPages" class="total-pages">0</span>
            </div>
            
            <button id="nextPage" class="btn ghost small control-btn">
              Next
              <span class="btn-icon">▶</span>
            </button>
          </div>
          
          <div class="page-jump-group">
            <input 
              type="number" 
              id="pageJump" 
              placeholder="Go to page" 
              min="1" 
              class="page-input"
            >
            <button id="goToPage" class="btn primary small go-btn">
              Go
            </button>
          </div>
        </div>

        <!-- PDF Canvas -->
        <div class="pdf-canvas-container">
          <canvas id="pdfCanvas" class="pdf-canvas"></canvas>
          <div id="pdfLoading" class="pdf-loading">
            <div class="loading-spinner"></div>
            <p>Loading PDF...</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div data-include="partials/footer.html"></div>

  <script src="script.js"></script>
</body>
</html>
