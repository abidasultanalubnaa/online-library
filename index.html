<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Online Library</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Global Header -->
    <div data-include="partials/header.html"></div>

    <!-- Hero Section -->
    <section class="hero">
      <div class="hero-carousel">
        <!-- Slide 1 -->
        <div class="hero-slide active">
          <img
            src="images/hero-1.jpg"
            alt="Book Collection"
            class="slide-img"
            onerror="this.src='https://images.unsplash.com/photo-1595123550441-d377e017de6a?q=80&w=1306&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D'"
          />
          <div class="slide-content">
            <h1>Your Next Great Read is Here</h1>
            <p>Find books that resonate with your soul</p>
            <a href="#all-books" class="btn primary">Browse Collection</a>
          </div>
        </div>

        <!-- Slide 2 -->
        <div class="hero-slide">
          <img
            src="images/hero-2.jpg"
            alt="Reading Space"
            class="slide-img"
            onerror="this.src='https://images.unsplash.com/photo-1677024348381-13c9024e3ed1?q=80&w=1331&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D'"
          />
          <div class="slide-content">
            <h1>Read Anywhere, Anytime</h1>
            <p>Access your library on all devices</p>
            <a href="#all-books" class="btn primary">Browse Collection</a>
          </div>
        </div>

        <!-- Slide 3 -->
        <div class="hero-slide">
          <img
            src="images/hero-3.jpg"
            alt="New Arrivals"
            class="slide-img"
            onerror="this.src='https://images.unsplash.com/photo-1512820790803-83ca734da794?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80'"
          />
          <div class="slide-content">
            <h1>Read Smarter, Achieve More</h1>
            <p>Transform your reading into actionable knowledge</p>
            <a href="#all-books" class="btn primary">Browse Collection</a>
          </div>
        </div>
      </div>

      <!-- Carousel Controls - Only Dots -->
      <div class="carousel-controls">
        <div class="carousel-dots">
          <span class="dot active" data-slide="0"></span>
          <span class="dot" data-slide="1"></span>
          <span class="dot" data-slide="2"></span>
        </div>
      </div>
    </section>

    <!-- Main Content -->
    <main class="container main">
      <!-- Search -->
      <section id="search" class="search-block card">
        <h2>Search the Library</h2>
        <form id="searchForm" class="search-form" onsubmit="return false;">
          <input
            id="searchInput"
            type="text"
            placeholder="Search by title, author, or description…"
          />
          <button id="searchBtn" class="btn">Search</button>
        </form>
        <div id="searchMeta" class="search-meta"></div>
      </section>

      <!-- All Books (Sort + Pagination) -->
      <section id="all-books" class="all-books">
        <div class="controls card">
          <div class="sort">
            <label for="sortSelect">Sort by:</label>
            <select id="sortSelect">
              <option value="title|asc">Title (A → Z)</option>
              <option value="title|desc">Title (Z → A)</option>
              <option value="author|asc">Author (A → Z)</option>
              <option value="author|desc">Author (Z → A)</option>
              <option value="id|asc">Newest (Old → New)</option>
              <option value="id|desc" selected>Newest (New → Old)</option>
            </select>
          </div>
          <div class="page-size">
            <label for="pageSizeSelect">Per page:</label>
            <select id="pageSizeSelect">
              <option>6</option>
              <option selected>8</option>
              <option>12</option>
              <option>18</option>
            </select>
          </div>
        </div>

        <div id="booksGrid" class="grid"></div>

        <div class="pagination" id="pagination"></div>
      </section>
    </main>

    <!-- Global Footer -->
    <div data-include="partials/footer.html"></div>

    <script src="script.js"></script>
  </body>
</html>
